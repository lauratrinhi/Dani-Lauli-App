<script>
  // Nach dem Neuladen nicht kurz "Home" zeigen, wenn man vorher woanders war
  try {
    const vorher = JSON.parse(sessionStorage.getItem("navAktuell"));
    if (vorher && vorher !== "heute") {
      document.documentElement.classList.add("nav-zurueck");
      setTimeout(() => document.documentElement.classList.remove("nav-zurueck"), 5000);
    }
  } catch (e) {}

<style>
  :root { --blau:#1f3a68; --blau-hell:#e8eef7; --text:#111827; --text2:#6b7280; --rand:#e5e7eb; --karte:#ffffff; --grund:#f6f7f9; --feld:#f3f4f6; --rot:#e11d48; }
  * { -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif; margin: 0; background: var(--grund); color: var(--text); -webkit-font-smoothing: antialiased; }

  header { display:flex; align-items:center; justify-content:space-between; max-width:500px; margin:auto; box-sizing:border-box;
    padding: max(14px, env(safe-area-inset-top)) 20px 4px; font-size: 32px; font-weight: 700; letter-spacing: -0.02em; }
  #glocke { width:40px; height:40px; border-radius:50%; background:var(--karte); border:0.5px solid var(--rand); color:var(--blau);
    display:flex; align-items:center; justify-content:center; font-size:20px; padding:0; margin:0; }
  #glocke.aus { color: var(--text2); }

  main { padding: 8px 16px 16px; max-width: 500px; margin: auto; }
  input, button, textarea, select { font-family: inherit; font-size: 16px; padding: 11px 12px; border-radius: 12px; width: 100%; box-sizing: border-box; margin-bottom: 8px; }
  input, textarea, select { background: var(--feld); border: 1px solid transparent; color: var(--text); }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--blau); background: var(--karte); }
  button { background: var(--blau); color: white; border: none; font-weight: 600; font-size: 15px; transition: transform .1s, opacity .1s; }
  button:active { transform: scale(.97); opacity: .85; }
  button[style*="#f3f3f3"], button[style*="243, 243, 243"], .grau { background: var(--karte) !important; color: var(--text) !important; border: 1px solid var(--rand) !important; }
  .grau { width: auto; }
  summary { cursor: pointer; }

  .post { background: var(--karte); border-radius: 16px; padding: 14px; margin-bottom: 14px; border: 0.5px solid var(--rand); box-shadow: none !important; }
  .post img, .post video { width: 100%; border-radius: 12px; }
  .meta { font-size: 13px; color: var(--text2); margin: 6px 0; }
  .spaet { color: var(--rot); font-weight: 600; }
  .kommentar { font-size: 14px; margin: 4px 0; line-height: 1.4; }
  .versteckt { display: none !important; }
  .nav-zurueck #app { visibility: hidden; }

  /* Feed-Karten */
  .feed-post { padding: 0; overflow: hidden; }
  .feed-post > img, .feed-post > video { border-radius: 0; display: block; }
  .feed-post > img.laedt { min-height: 280px; background: var(--feld); object-fit: cover; animation: puls 1.2s ease-in-out infinite; }
  @keyframes puls { 50% { opacity: .55; } }
  .kopf { display: flex; align-items: center; gap: 10px; padding: 12px 14px; }
  .avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--blau-hell); color: var(--blau); font-weight: 700; font-size: 14px;
    display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
  .kopf .name { font-weight: 600; font-size: 15px; }
  .kopf .zeit { margin-left: auto; font-size: 13px; color: var(--text2); text-align: right; }
  .aktionen { display: flex; align-items: center; gap: 2px; padding: 6px 8px 0; }
  .icon { width: auto; background: none !important; border: none !important; color: var(--text) !important; padding: 8px; margin: 0; font-size: 24px; line-height: 1; }
  .icon.rot { color: var(--rot) !important; }
  .icon.blau { color: var(--blau) !important; }
  .chips { margin-left: auto; display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
  .chip { width: auto; margin: 0; padding: 4px 9px; font-size: 13px; font-weight: 500; border-radius: 14px; background: var(--feld) !important; color: var(--text) !important; border: 1px solid transparent !important; }
  .chip.meins { background: var(--blau-hell) !important; border-color: #c9d6ea !important; }
  .emoji-wahl { display: flex; gap: 6px; padding: 4px 14px 0; flex-wrap: wrap; }
  .emoji-wahl button { width: auto; margin: 0; padding: 6px 10px; font-size: 20px; border-radius: 20px; background: var(--feld) !important; color: var(--text) !important; }
  .feed-post .kommentare { padding: 4px 14px 0; }
  .kommentar-feld { display: flex; align-items: center; gap: 2px; background: var(--feld); border-radius: 22px; margin: 8px 12px 12px; padding: 0 4px 0 14px; }
  .kommentar-feld input { background: none !important; border: none !important; margin: 0; padding: 10px 0; flex: 1; }
  .kommentar-feld .icon { font-size: 21px; padding: 7px; }

  /* Foto-Knopf */
  #plusKnopf { position: fixed; right: 20px; bottom: calc(84px + env(safe-area-inset-bottom)); z-index: 45; width: 58px; height: 58px; margin: 0; padding: 0;
    border-radius: 50%; font-size: 28px; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 18px rgba(31,58,104,.35); }
  body:not(.auf-home) #plusKnopf, body:has(#app.versteckt) #plusKnopf { display: none; }

  /* Kurze Hinweise statt Pop-ups */
  #toastBox { position: fixed; left: 0; right: 0; bottom: calc(96px + env(safe-area-inset-bottom)); z-index: 200; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; padding: 0 20px; }
  .toast { background: #111827; color: #fff; padding: 11px 16px; border-radius: 14px; font-size: 14px; font-weight: 500; max-width: 420px; text-align: center;
    box-shadow: 0 8px 24px rgba(0,0,0,.18); transition: opacity .3s, transform .3s; }
  .toast.fehler { background: var(--rot); }
  .toast.weg { opacity: 0; transform: translateY(8px); }

  /* Unterreiter als iOS-Segmente */
  body #unterLeiste { background: #e9ecf1; border-radius: 12px; padding: 3px; gap: 2px; margin: 2px 0 14px; top: 6px; }
  body #unterLeiste button { background: transparent; color: var(--text2); border-radius: 10px; padding: 8px 4px; font-size: 14px; font-weight: 600; }
  body #unterLeiste button.aktiv { background: var(--karte); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  body #untenLeiste { background: rgba(255,255,255,.92); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); }

  @media (prefers-color-scheme: dark) {
    :root { --text:#f3f4f6; --text2:#9ca3af; --rand:#2d3748; --karte:#1a2130; --grund:#0f141c; --feld:#232b3a; --blau-hell:#24324a; }
    header { color: var(--text); }
    #glocke { color: #93c5fd; }
    .toast { background: #f3f4f6; color: #111827; }
    body #unterLeiste { background: #1a2130 !important; }
    body #unterLeiste button { background: transparent !important; color: var(--text2) !important; }
    body #unterLeiste button.aktiv { background: #2d3748 !important; color: var(--text) !important; }
    body #untenLeiste { background: rgba(26,33,48,.92) !important; }
    .icon.blau { color: #93c5fd !important; }
    .chip.meins { border-color: #3b4f70 !important; }
  }
</style>

<script>
/* =========================================================
   Einstellungen
   ========================================================= */
const SUPABASE_URL = "https://uqsakgfdlcnvqqkhdryt.supabase.co";
const SUPABASE_KEY = "sb_publishable_pFCNvR9izezcO8GZOD6tTA_ET-YppfI";
const GIPHY_KEY = "kEmWwXsKqsGfZMIqsEQY7vP3YVqCcXLQ";
const VAPID_PUBLIC = "BN9ZIOLWc1yuuTJW3ZZE1F3Mxl8ZuYyQhfcdg8rliLdmtgNNVLopFWgZzEaK9d7UBRmrnAWd3TK1DwoGHVF2WCo";

const EMOJIS = ["❤️", "😂", "😭", "😮"];
const MAX_VIDEO_SEKUNDEN = 15;

const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let ich = null;
let leute = [];

// Kurze Hinweise unten statt Pop-up-Fenster
function toast(text, art = "info") {
  let box = document.getElementById("toastBox");
  if (!box) { box = document.createElement("div"); box.id = "toastBox"; document.body.appendChild(box); }
  const t = document.createElement("div");
  t.className = "toast " + art;
  t.textContent = text;
  box.appendChild(t);
  const dauer = Math.min(6000, 1800 + String(text).length * 45);
  setTimeout(() => t.classList.add("weg"), dauer);
  setTimeout(() => t.remove(), dauer + 400);
}
window.alert = text => toast(String(text), /fehl|fehler|nicht|bitte|zu groß|höchstens/i.test(String(text)) ? "fehler" : "info");

function wieLange(datum) {
  const s = (Date.now() - new Date(datum)) / 1000;
  if (s < 60) return "gerade eben";
  if (s < 3600) return `vor ${Math.floor(s / 60)} Min.`;
  if (s < 86400) return `vor ${Math.floor(s / 3600)} Std.`;
  if (s < 172800) return "gestern";
  if (s < 604800) return `vor ${Math.floor(s / 86400)} Tagen`;
  return new Date(datum).toLocaleDateString("de-DE", { day: "numeric", month: "short" });
}

window.addEventListener("error", e => alert("Fehler: " + e.message));
window.addEventListener("unhandledrejection", e => alert("Fehler: " + (e.reason && e.reason.message || e.reason)));

/* =========================================================
   Hilfsfunktionen
   ========================================================= */
function schuetzen(t) {
  return String(t ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function nameVon(id) {
  return (leute.find(p => p.user_id === id) || {}).name || "?";
}

async function leuteLaden() {
  if (!leute.length) leute = speicherLesen("leute", []);
  if (window.leuteGeladen) return;
  const { data } = await db.from("personen").select("user_id, name");
  if (data && data.length) {
    leute = data;
    speicherSchreiben("leute", data);
    window.leuteGeladen = true;
  }
}

// Verkleinert ein Bild (z. B. Handyfoto) und gibt es als Blob zurück
function bildVerkleinern(datei, maxSeite, typ = "image/jpeg", qualitaet = 0.85) {
  return new Promise((ok, fehler) => {
    const bild = new Image();
    bild.onload = () => {
      const f = Math.min(1, maxSeite / Math.max(bild.width, bild.height));
      const c = document.createElement("canvas");
      c.width = Math.round(bild.width * f);
      c.height = Math.round(bild.height * f);
      c.getContext("2d").drawImage(bild, 0, 0, c.width, c.height);
      URL.revokeObjectURL(bild.src);
      c.toBlob(b => b ? ok(b) : fehler(new Error("Bild konnte nicht umgewandelt werden")), typ, qualitaet);
    };
    bild.onerror = () => fehler(new Error("Bild konnte nicht geladen werden"));
    bild.src = URL.createObjectURL(datei);
  });
}

function videoDauer(datei) {
  return new Promise(ok => {
    const v = document.createElement("video");
    v.preload = "metadata";
    v.onloadedmetadata = () => { URL.revokeObjectURL(v.src); ok(v.duration || 0); };
    v.onerror = () => ok(0);
    v.src = URL.createObjectURL(datei);
  });
}

/* =========================================================
   Start & Login
   ========================================================= */
async function start() {
  const { data } = await db.auth.getSession();
  if (data.session) { ich = data.session.user; zeigeApp(); }
}

async function einloggen() {
  const { data, error } = await db.auth.signInWithPassword({
    email: document.getElementById("email").value,
    password: document.getElementById("passwort").value
  });
  if (error) return alert("Login fehlgeschlagen: " + error.message);
  ich = data.user;
  zeigeApp();
}

async function zeigeApp() {
  document.getElementById("login").classList.add("versteckt");
  document.getElementById("app").classList.remove("versteckt");
  ladeFeed();
  ladeBesuch();
  ladeNotizen();
  pushStatusZeigen();
}

document.addEventListener("visibilitychange", () => {
  if (!document.hidden && ich) ladeNotizen();
});

/* =========================================================
   Fotos & Videos posten
   ========================================================= */
async function hochladen(datei) {
  if (!datei) return;
  const feld = document.getElementById("datei");
  const istVideo = datei.type.startsWith("video");

  try {
    if (istVideo) {
      const dauer = await videoDauer(datei);
      if (dauer > MAX_VIDEO_SEKUNDEN + 1) {
        feld.value = "";
        return alert(`Videos dürfen höchstens ${MAX_VIDEO_SEKUNDEN} Sekunden lang sein (dieses hat ${Math.round(dauer)} Sekunden).`);
      }
      if (datei.size > 50 * 1024 * 1024) {
        feld.value = "";
        return alert("Das Video ist zu groß (max. 50 MB).");
      }
    }

    toast("Wird hochgeladen …");

    // Zu spät? (mehr als 2 Minuten nach dem heutigen Alarm)
    const { data: alarme } = await db.from("alarme").select("*").order("ausgeloest_um", { ascending: false }).limit(1);
    let alarmId = null, zuSpaet = false;
    if (alarme && alarme.length) {
      const zeit = new Date(alarme[0].ausgeloest_um);
      if (zeit.toDateString() === new Date().toDateString()) {
        alarmId = alarme[0].id;
        zuSpaet = (Date.now() - zeit.getTime()) > 2 * 60 * 1000;
      }
    }

    let inhalt = datei, endung = (datei.name.split(".").pop() || "mov").toLowerCase(), typInfo = {};
    if (!istVideo) {
      inhalt = await bildVerkleinern(datei, 1600);
      endung = "jpg";
      typInfo = { contentType: "image/jpeg" };
    }
    const pfad = `${ich.id}/${Date.now()}.${endung}`;
    const { error: fehler } = await db.storage.from("medien").upload(pfad, inhalt, { ...typInfo, cacheControl: "31536000" });
    if (fehler) throw fehler;

    const { error } = await db.from("posts").insert({ datei_pfad: pfad, typ: istVideo ? "video" : "foto", alarm_id: alarmId, zu_spaet: zuSpaet });
    if (error) throw error;

    toast("Gepostet ✓");
    ladeFeed();
  } catch (e) {
    alert("Upload fehlgeschlagen: " + e.message);
  } finally {
    feld.value = "";
  }
}

/* =========================================================
   Feed, Reaktionen & Kommentare
   ========================================================= */
// Bild-Links und letzten Feed auf dem Handy merken, damit nach dem Neuladen sofort etwas da ist
function speicherLesen(name, standard) {
  try { return JSON.parse(localStorage.getItem(name)) ?? standard; } catch (e) { return standard; }
}
function speicherSchreiben(name, wert) {
  try { localStorage.setItem(name, JSON.stringify(wert)); } catch (e) {}
}

function feedLinks() {
  if (!window.feedLinksSpeicher) {
    const gespeichert = speicherLesen("feedLinks", {});
    const jetzt = Date.now();
    window.feedLinksSpeicher = {};
    for (const [pfad, eintrag] of Object.entries(gespeichert)) {
      if (eintrag && eintrag.bis > jetzt) window.feedLinksSpeicher[pfad] = eintrag;
    }
  }
  return window.feedLinksSpeicher;
}

function feedZeichnen(posts) {
  const links = feedLinks();
  const feed = document.createDocumentFragment();
  for (const p of posts || []) {
    const url = links[p.datei_pfad]?.url || "";
    const name = nameVon(p.user_id);
    const medium = p.typ === "video"
      ? `<video src="${url}" controls playsinline preload="metadata"></video>`
      : `<img src="${url}" class="laedt" decoding="async" onload="this.classList.remove('laedt')">`;

    const reaktionen = p.reaktionen || [];
    const herzVonMir = reaktionen.some(r => r.emoji === "❤️" && r.user_id === ich.id);
    const chips = [...new Set(reaktionen.map(r => r.emoji))].map(e => {
      const alle = reaktionen.filter(r => r.emoji === e);
      const meins = alle.some(r => r.user_id === ich.id);
      return `<button class="chip ${meins ? "meins" : ""}" onclick="reagieren(${p.id}, '${e}')">${e} ${alle.length}</button>`;
    }).join("");

    const kommentare = (p.kommentare || []).slice()
      .sort((a, b) => new Date(a.erstellt_um) - new Date(b.erstellt_um))
      .map(k => `<div class="kommentar"><b>${schuetzen(nameVon(k.user_id))}</b> ${k.gif_url
        ? `<br><img src="${schuetzen(k.gif_url)}" style="width:55%;border-radius:12px;margin-top:4px">`
        : schuetzen(k.text)}</div>`)
      .join("");

    const div = document.createElement("div");
    div.className = "post feed-post";
    div.innerHTML = `
      <div class="kopf">
        <div class="avatar">${schuetzen(name.charAt(0).toUpperCase())}</div>
        <div class="name">${schuetzen(name)}</div>
        <div class="zeit">${wieLange(p.erstellt_um)}${p.zu_spaet ? '<br><span class="spaet">zu spät</span>' : ""}</div>
      </div>
      ${medium}
      <div class="aktionen">
        <button class="icon ${herzVonMir ? "rot" : ""}" onclick="reagieren(${p.id}, '❤️')" aria-label="Gefällt mir"><i class="ti ti-heart"></i></button>
        <button class="icon" onclick="document.getElementById('k${p.id}').focus()" aria-label="Kommentieren"><i class="ti ti-message-circle"></i></button>
        <button class="icon" onclick="document.getElementById('ew${p.id}').classList.toggle('versteckt')" aria-label="Reagieren"><i class="ti ti-mood-smile"></i></button>
        <div class="chips">${chips}</div>
      </div>
      <div class="emoji-wahl versteckt" id="ew${p.id}">
        ${EMOJIS.map(e => `<button onclick="reagieren(${p.id}, '${e}')">${e}</button>`).join("")}
        <button onclick="eigenesEmoji(${p.id})" aria-label="Anderes Emoji">＋</button>
      </div>
      ${kommentare ? `<div class="kommentare">${kommentare}</div>` : ""}
      <div class="kommentar-feld">
        <input id="k${p.id}" placeholder="Kommentieren …" enterkeyhint="send" onkeydown="if (event.key === 'Enter') kommentieren(${p.id})">
        <button class="icon" onclick="gifSuchen(${p.id})" aria-label="GIF oder Sticker"><i class="ti ti-gif"></i></button>
        <button class="icon blau" onclick="kommentieren(${p.id})" aria-label="Senden"><i class="ti ti-send"></i></button>
      </div>`;
    feed.appendChild(div);
  }

  // Getippten Kommentar nicht verlieren, wenn der Feed neu gezeichnet wird
  const offen = {};
  document.querySelectorAll('#feed input[id^="k"]').forEach(f => { if (f.value) offen[f.id] = f.value; });
  const fokus = document.activeElement?.id;

  const y = window.scrollY;
  document.getElementById("feed").replaceChildren(feed);
  window.scrollTo(0, y);

  for (const [id, wert] of Object.entries(offen)) {
    const f = document.getElementById(id);
    if (f) f.value = wert;
  }
  if (fokus && fokus.startsWith("k")) document.getElementById(fokus)?.focus();
}

let feedGezeichnet = false;

async function ladeFeed() {
  // 1. Sofort den zuletzt bekannten Feed anzeigen
  if (!feedGezeichnet) {
    if (!leute.length) leute = speicherLesen("leute", []);
    const alt = speicherLesen("feedCache", null);
    if (alt) { feedZeichnen(alt); feedGezeichnet = true; }
  }

  // 2. Aktuelle Daten holen (Namen und Posts gleichzeitig)
  const [, antwort] = await Promise.all([
    leuteLaden(),
    db.from("posts").select("*, reaktionen(*), kommentare(*)").order("erstellt_um", { ascending: false }).limit(30)
  ]);
  const posts = antwort.data || [];

  // 3. Nur für neue Bilder Links holen, alte wiederverwenden (dann kommen sie aus dem Handy-Speicher)
  const links = feedLinks();
  const fehlend = posts.map(p => p.datei_pfad).filter(x => !links[x]);
  if (fehlend.length) {
    const { data: neu } = await db.storage.from("medien").createSignedUrls(fehlend, 7 * 86400);
    const bis = Date.now() + 6 * 86400 * 1000;
    (neu || []).forEach(l => { if (l.signedUrl) links[l.path] = { url: l.signedUrl, bis }; });
    speicherSchreiben("feedLinks", links);
  }

  speicherSchreiben("feedCache", posts);
  feedZeichnen(posts);
  feedGezeichnet = true;
}

async function reagieren(postId, emoji) {
  const { error } = await db.from("reaktionen").insert({ post_id: postId, emoji });
  if (error) await db.from("reaktionen").delete().match({ post_id: postId, emoji, user_id: ich.id });
  ladeFeed();
}

async function eigenesEmoji(postId) {
  const e = (prompt("Welches Emoji? Tipp einfach eins ein 😊") || "").trim();
  if (!e) return;
  if (e.length > 12 || /[<>"'`\\]/.test(e) || !/\p{Extended_Pictographic}/u.test(e)) {
    return alert("Bitte nur ein Emoji eingeben.");
  }
  reagieren(postId, e);
}

async function kommentieren(postId) {
  const feld = document.getElementById("k" + postId);
  const text = feld.value.trim();
  if (!text) return;
  const { error } = await db.from("kommentare").insert({ post_id: postId, text });
  if (error) return alert("Fehler: " + error.message);
  ladeFeed();
}

/* =========================================================
   GIFs, Sticker & eigene Sticker
   ========================================================= */
let gifPost = null;
let gifArt = "gifs";
let stickerBearbeiten = false;

function gifFenster() {
  let f = document.getElementById("gifFenster");
  if (f) return f;
  f = document.createElement("div");
  f.id = "gifFenster";
  f.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:none;align-items:flex-end";
  f.innerHTML = `
    <div style="background:#fff;width:100%;height:75vh;border-radius:16px 16px 0 0;padding:12px;box-sizing:border-box;display:flex;flex-direction:column">
      <div style="display:flex;gap:6px">
        <input id="gifSuche" placeholder="Suchen …" style="flex:1">
        <button onclick="gifSchliessen()" class="grau">✕</button>
      </div>
      <div style="display:flex;gap:6px;margin-top:8px">
        <button id="artGifs" onclick="gifArtWechseln('gifs')" style="flex:1">GIFs</button>
        <button id="artStickers" onclick="gifArtWechseln('stickers')" style="flex:1;background:#f3f3f3;color:#333">Sticker</button>
        <button id="artEigene" onclick="gifArtWechseln('eigene')" style="flex:1;background:#f3f3f3;color:#333">⭐ Eigene</button>
      </div>
      <div id="gifErgebnisse" style="display:grid;grid-template-columns:1fr 1fr;gap:6px;overflow-y:auto;margin-top:8px;flex:1;align-content:start"></div>
      <div class="meta" style="text-align:center">Powered by GIPHY</div>
    </div>`;
  document.body.appendChild(f);
  let timer;
  f.querySelector("#gifSuche").oninput = e => { clearTimeout(timer); timer = setTimeout(() => gifLaden(e.target.value), 400); };
  f.onclick = e => { if (e.target === f) gifSchliessen(); };
  return f;
}

function gifSuchen(postId) {
  gifPost = postId;
  gifFenster().style.display = "flex";
  document.getElementById("gifSuche").value = "";
  gifLaden("");
}

function gifSchliessen() {
  document.getElementById("gifFenster").style.display = "none";
}

function gifArtWechseln(art) {
  gifArt = art;
  [["artGifs", "gifs"], ["artStickers", "stickers"], ["artEigene", "eigene"]].forEach(([id, a]) => {
    const k = document.getElementById(id);
    if (k) k.style.cssText = a === art ? "flex:1" : "flex:1;background:#f3f3f3;color:#333";
  });
  gifLaden(document.getElementById("gifSuche").value);
}

async function gifLaden(suche) {
  if (gifArt === "eigene") return eigeneStickerLaden();
  const box = document.getElementById("gifErgebnisse");
  const url = suche.trim()
    ? `https://api.giphy.com/v1/${gifArt}/search?api_key=${GIPHY_KEY}&q=${encodeURIComponent(suche)}&limit=24&rating=pg-13&lang=de`
    : `https://api.giphy.com/v1/${gifArt}/trending?api_key=${GIPHY_KEY}&limit=24&rating=pg-13`;
  try {
    const { data } = await (await fetch(url)).json();
    box.innerHTML = (data || []).map(g => {
      const klein = g.images.fixed_width.url;
      return `<img src="${klein}" onclick="gifSenden('${klein}')" style="width:100%;border-radius:8px">`;
    }).join("") || '<div class="meta">Nichts gefunden</div>';
  } catch (e) {
    box.innerHTML = '<div class="meta">GIFs konnten nicht geladen werden</div>';
  }
}

async function kommentarMitBild(url) {
  gifSchliessen();
  const { error } = await db.from("kommentare").insert({ post_id: gifPost, text: "", gif_url: url });
  if (error) return alert("Fehler: " + error.message);
  ladeFeed();
}

function gifSenden(url) {
  if (url.startsWith("https://media")) kommentarMitBild(url);
}

async function eigeneStickerLaden() {
  const box = document.getElementById("gifErgebnisse");
  const { data } = await db.from("sticker").select("*").order("erstellt_um", { ascending: false });
  window.eigeneSticker = data || [];
  const kacheln = window.eigeneSticker.map(s => `
    <div style="position:relative">
      <img src="${schuetzen(s.url)}" onclick="${stickerBearbeiten ? `stickerLoeschen(${s.id})` : `stickerSenden(${s.id})`}" style="width:100%;aspect-ratio:1;object-fit:contain;border-radius:8px;background:#f3f3f3">
      ${stickerBearbeiten ? '<div style="position:absolute;top:4px;right:6px;font-size:20px;pointer-events:none">🗑️</div>' : ""}
    </div>`).join("");
  box.innerHTML = `
    <div style="grid-column:1/-1;display:flex;gap:6px">
      <button onclick="document.getElementById('stickerDatei').click()">+ Eigenen Sticker hinzufügen</button>
      <button onclick="stickerBearbeitenUmschalten()" class="grau">${stickerBearbeiten ? "Fertig" : "✏️"}</button>
    </div>
    <div class="meta" style="grid-column:1/-1">Sticker aus deiner Tastatur: Tipp ins Feld und wähl einen aus 👇</div>
    <div id="tastaturFeld" contenteditable="true" style="grid-column:1/-1;min-height:44px;border:2px dashed #1f3a68;border-radius:10px;padding:10px;background:#fff"></div>
    <input id="stickerDatei" type="file" accept="image/*" class="versteckt" onchange="stickerHochladen(this.files[0])">
    ${kacheln || '<div class="meta" style="grid-column:1/-1">Noch keine eigenen Sticker</div>'}`;
  tastaturFeldEinrichten();
}

function stickerBearbeitenUmschalten() {
  stickerBearbeiten = !stickerBearbeiten;
  eigeneStickerLaden();
}

// Lädt ein Bild als Sticker hoch und gibt die öffentliche Adresse zurück
async function stickerSpeichern(datei) {
  const blob = await bildVerkleinern(datei, 400, "image/png");
  const pfad = `${ich.id}/${Date.now()}.png`;
  const { error } = await db.storage.from("sticker").upload(pfad, blob, { contentType: "image/png" });
  if (error) throw error;
  const url = db.storage.from("sticker").getPublicUrl(pfad).data.publicUrl;
  const { error: fehler } = await db.from("sticker").insert({ url, pfad });
  if (fehler) throw fehler;
  return url;
}

async function stickerHochladen(datei) {
  if (!datei) return;
  try {
    await stickerSpeichern(datei);
    eigeneStickerLaden();
  } catch (e) {
    alert("Sticker konnte nicht hochgeladen werden: " + e.message);
  }
}

function stickerSenden(id) {
  const s = (window.eigeneSticker || []).find(x => x.id === id);
  if (s) kommentarMitBild(s.url);
}

async function stickerLoeschen(id) {
  if (!confirm("Diesen Sticker aus eurer Sammlung löschen?")) return;
  await db.from("sticker").delete().eq("id", id);
  eigeneStickerLaden();
}

async function tastaturSticker(datei) {
  const feld = document.getElementById("tastaturFeld");
  if (feld) feld.innerHTML = "";
  try {
    kommentarMitBild(await stickerSpeichern(datei));
  } catch (e) {
    alert("Sticker konnte nicht gesendet werden: " + e.message);
  }
}

function tastaturFeldEinrichten() {
  const feld = document.getElementById("tastaturFeld");
  if (!feld || feld.dataset.bereit) return;
  feld.dataset.bereit = "1";
  const bildAus = dt => dt && [...(dt.files || [])].find(f => f.type.startsWith("image/"));
  feld.addEventListener("paste", e => {
    const datei = bildAus(e.clipboardData);
    if (datei) { e.preventDefault(); tastaturSticker(datei); }
  });
  feld.addEventListener("beforeinput", e => {
    const datei = bildAus(e.dataTransfer);
    if (datei) { e.preventDefault(); tastaturSticker(datei); }
  });
  feld.addEventListener("input", async () => {
    const bild = feld.querySelector("img");
    if (!bild) return;
    try {
      const blob = await (await fetch(bild.src)).blob();
      tastaturSticker(new File([blob], "sticker.png", { type: blob.type || "image/png" }));
    } catch (e) {
      feld.innerHTML = "";
      alert("Dieser Sticker lässt sich hier leider nicht einfügen.");
    }
  });
}

/* =========================================================
   Countdown & Treffen
   ========================================================= */
let besuche = [];

async function ladeBesuch() {
  const { data } = await db.from("besuche").select("*")
    .gte("ankunft", new Date(Date.now() - 60 * 864e5).toISOString())
    .order("ankunft");
  const jetzt = new Date();
  besuche = (data || []).filter(b =>
    new Date(b.ankunft) > jetzt || (b.abreise && new Date(b.abreise + "T23:59") >= jetzt));
  zeigeCountdown();
  zeigeLetzteFahrt();
}

function restZeit(datum) {
  const diff = new Date(datum) - new Date();
  if (diff <= 0) return "Ihr seid zusammen 💕";
  const t = Math.floor(diff / 864e5), h = Math.floor(diff / 36e5) % 24, m = Math.floor(diff / 6e4) % 60;
  return `Noch ${t} T · ${h} Std · ${m} Min 💕`;
}

function zeigeCountdown() {
  const el = document.getElementById("countdown");
  const info = document.getElementById("besuchInfo");
  if (!besuche.length) { el.textContent = "Noch kein Treffen geplant"; info.innerHTML = ""; return; }
  el.textContent = restZeit(besuche[0].ankunft);
  info.innerHTML = besuche.map(b => {
    const ankunft = new Date(b.ankunft).toLocaleString("de-DE", { weekday: "short", day: "numeric", month: "numeric", hour: "2-digit", minute: "2-digit" });
    const bis = b.abreise ? " · bis " + new Date(b.abreise).toLocaleDateString("de-DE") : "";
    return `<div style="display:flex;align-items:center;gap:8px;margin:8px 0;text-align:left">
      <div style="flex:1">${schuetzen(b.reisender)}<br>Ankunft ${ankunft}${bis}<br><b>${restZeit(b.ankunft)}</b></div>
      <button onclick="besuchLoeschen(${b.id})" class="grau">🗑️</button>
    </div>`;
  }).join("");
}

async function zeigeLetzteFahrt() {
  const { data } = await db.from("besuche").select("reisender, ankunft")
    .lte("ankunft", new Date().toISOString())
    .order("ankunft", { ascending: false }).limit(1);
  const el = document.getElementById("letzteFahrt");
  if (!data || !data.length) { el.innerHTML = ""; return; }
  const zuletzt = data[0].reisender.split(" ")[0];
  const auswahl = document.getElementById("reisender");
  const naechste = [...auswahl.options].find(o => !o.value.startsWith(zuletzt));
  if (naechste) auswahl.value = naechste.value;
  const wer = naechste ? naechste.value.split(" ")[0] : "?";
  const datum = new Date(data[0].ankunft).toLocaleDateString("de-DE");
  el.innerHTML = `🚆 Zuletzt gefahren: <b>${schuetzen(zuletzt)}</b> (${datum})<br>Als Nächstes dran: <b>${schuetzen(wer)}</b>`;
}

async function besuchSpeichern() {
  const ankunft = document.getElementById("ankunft").value;
  if (!ankunft) return alert("Bitte die Ankunft eintragen.");
  const { error } = await db.from("besuche").insert({
    reisender: document.getElementById("reisender").value,
    ankunft: new Date(ankunft).toISOString(),
    abreise: document.getElementById("abreise").value || null
  });
  if (error) return alert("Fehler: " + error.message);
  document.getElementById("ankunft").value = "";
  document.getElementById("abreise").value = "";
  ladeBesuch();
}

async function besuchLoeschen(id) {
  if (!confirm("Diesen Termin wirklich löschen?")) return;
  const { error } = await db.from("besuche").delete().eq("id", id);
  if (error) return alert("Fehler: " + error.message);
  ladeBesuch();
}

setInterval(zeigeCountdown, 60000);

async function ladeNotizen() {
  await leuteLaden();

  const offen = data || [];
  document.getElementById("notizenListe").innerHTML = offen.map(n => `

      <div style="flex:1" class="kommentar">${n.an === ich.id ? "💌 Von " + schuetzen(nameVon(n.von)) : "📤 An " + schuetzen(nameVon(n.an))}: ${schuetzen(n.text)}</div>

  const fuerMich = offen.filter(n => n.an === ich.id).length;

async function notizSenden() {
  const feld = document.getElementById("notizText");
  const text = feld.value.trim();
  if (!text) return;
  const anderer = leute.find(p => p.user_id !== ich.id);

  if (error) return alert("Fehler: " + error.message);
  feld.value = "";
  ladeNotizen();
}

async function notizErledigt(id) {
  await db.from("notizen").update({ erledigt: true }).eq("id", id);
  ladeNotizen();
}

/* =========================================================
   Push-Benachrichtigungen
   ========================================================= */
function base64ZuBytes(s) {
  const rest = "=".repeat((4 - s.length % 4) % 4);
  const roh = atob((s + rest).replace(/-/g, "+").replace(/_/g, "/"));
  return Uint8Array.from([...roh].map(c => c.charCodeAt(0)));
}

async function pushAktivieren() {
  if (!("serviceWorker" in navigator) || !("PushManager" in window)) {
    return alert("Bitte öffne die App über das Symbol auf dem Home-Bildschirm.");
  }
  const erlaubnis = await Notification.requestPermission();
  if (erlaubnis !== "granted") return alert("Benachrichtigungen wurden nicht erlaubt.");
  const reg = await navigator.serviceWorker.register("sw.js");
  await navigator.serviceWorker.ready;
  let abo = await reg.pushManager.getSubscription();
  if (!abo) {
    abo = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: base64ZuBytes(VAPID_PUBLIC) });
  }
  const { error } = await db.from("push_abos").upsert({ abo: abo.toJSON() }, { onConflict: "user_id,abo", ignoreDuplicates: true });
  if (error) return alert("Fehler: " + error.message);
  toast("Benachrichtigungen an ✓");
}

async function pushStatusZeigen() {
  const glocke = document.getElementById("glocke");
  if (!glocke) return;
  let aktiv = false;
  if ("serviceWorker" in navigator && "PushManager" in window && Notification.permission === "granted") {
    const reg = await navigator.serviceWorker.getRegistration();
    aktiv = !!(reg && await reg.pushManager.getSubscription());
  }
  glocke.dataset.aktiv = aktiv ? "1" : "";
  glocke.classList.toggle("aus", !aktiv);
  glocke.innerHTML = `<i class="ti ${aktiv ? "ti-bell" : "ti-bell-off"}"></i>`;
}

async function pushUmschalten() {
  const glocke = document.getElementById("glocke");
  if (glocke.dataset.aktiv) {
    if (!confirm("Benachrichtigungen auf diesem Handy ausschalten?")) return;
    const reg = await navigator.serviceWorker.getRegistration();
    const abo = reg && await reg.pushManager.getSubscription();
    if (abo) {
      await db.from("push_abos").delete().eq("abo->>endpoint", abo.endpoint);
      await abo.unsubscribe();
    }
    toast("Benachrichtigungen aus");
  } else {
    await pushAktivieren();
  }
  pushStatusZeigen();
}

}
