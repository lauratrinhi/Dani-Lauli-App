<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Servus🥨">
<meta name="theme-color" content="#f6f7f9">
<title>Servus🥨</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css">
<style>
  :root {
    --blau:#1f3a68; --blau-text:#1f3a68; --blau-hell:#e8eef7; --text:#111827; --text2:#6b7280; --text3:#9ca3af;
    --rand:#e5e7eb; --karte:#ffffff; --grund:#f6f7f9; --feld:#f3f4f6; --rot:#e11d48; --gruen:#16a34a; --gold:#f59e0b;
  }
  @media (prefers-color-scheme: dark) {
    :root { --blau-text:#93c5fd; --blau-hell:#24324a; --text:#f3f4f6; --text2:#9ca3af; --text3:#6b7280;
      --rand:#2a3344; --karte:#171e2b; --grund:#0e131b; --feld:#222b3b; }
  }
  * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
  html { color-scheme: light dark; }
  body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif; margin: 0;
    background: var(--grund); color: var(--text); -webkit-font-smoothing: antialiased; padding-bottom: calc(80px + env(safe-area-inset-bottom)); }
  body.ausgeloggt { padding-bottom: 0; }

  /* Grundelemente */
  input, textarea, select { font-family: inherit; font-size: 16px; width: 100%; padding: 12px 14px; border-radius: 12px;
    background: var(--feld); border: 1px solid transparent; color: var(--text); margin: 0 0 10px; }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--blau-text); background: var(--karte); }
  textarea { resize: vertical; }
  button { font-family: inherit; cursor: pointer; }
  .knopf { display: inline-flex; align-items: center; justify-content: center; gap: 6px; width: 100%; padding: 13px 16px; margin: 0;
    border-radius: 12px; border: none; background: var(--blau); color: #fff; font-size: 15px; font-weight: 600; white-space: nowrap; transition: transform .1s, opacity .1s; }
  .knopf:active, .icon-knopf:active, .chip:active { transform: scale(.97); opacity: .85; }
  .knopf.zweit { background: var(--karte); color: var(--text); border: 1px solid var(--rand); }
  .knopf.gefahr { background: var(--rot); }
  .knopf.klein { width: auto; padding: 8px 12px; font-size: 14px; border-radius: 10px; }
  .knopf i { font-size: 18px; }
  .icon-knopf { display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 38px; flex: 0 0 auto; padding: 0; margin: 0;
    border-radius: 50%; border: none; background: none; color: var(--text2); font-size: 20px; }
  .icon-knopf.blau { color: var(--blau-text); }
  .icon-knopf.rot { color: var(--rot); }
  .icon-knopf.rund { background: var(--feld); }
  .reihe { display: flex; gap: 8px; align-items: center; }
  .reihe > .knopf { flex: 1; }
  .versteckt { display: none !important; }
  a { color: var(--blau-text); text-decoration: none; }

  /* Kopfzeile */
  header { display: flex; align-items: center; justify-content: space-between; max-width: 520px; margin: auto;
    padding: max(14px, env(safe-area-inset-top)) 20px 6px; }
  #titel { font-size: 32px; font-weight: 700; letter-spacing: -0.02em; }
  main { padding: 6px 16px 16px; max-width: 520px; margin: auto; }

  /* Karten & Listen */
  .karte, .post { background: var(--karte); border: 0.5px solid var(--rand); border-radius: 18px; padding: 16px; margin-bottom: 14px; }
  .karte-titel { display: flex; align-items: center; justify-content: space-between; font-size: 17px; font-weight: 700; margin: 0 0 10px; }
  .abschnitt { font-size: 13px; font-weight: 600; color: var(--text2); margin: 18px 4px 8px; text-transform: uppercase; letter-spacing: .04em; }
  .abschnitt:first-child { margin-top: 4px; }
  .meta { font-size: 13px; color: var(--text2); margin: 4px 0; }
  .zeile { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 0.5px solid var(--rand); }
  .zeile:last-child { border-bottom: none; padding-bottom: 2px; }
  .zeile:first-child { padding-top: 2px; }
  .zeile .inhalt { flex: 1; min-width: 0; }
  .zeile .haupt { font-size: 15px; line-height: 1.35; overflow-wrap: anywhere; }
  .zeile .neben { font-size: 13px; color: var(--text2); margin-top: 2px; }
  .kreis { width: 26px; height: 26px; flex: 0 0 auto; border-radius: 50%; border: 2px solid var(--text3); background: none; padding: 0; margin: 0;
    display: inline-flex; align-items: center; justify-content: center; color: transparent; font-size: 15px; }
  .kreis.an { background: var(--gruen); border-color: var(--gruen); color: #fff; }
  .leer { text-align: center; color: var(--text2); padding: 26px 12px; font-size: 14px; }
  .leer i { display: block; font-size: 34px; color: var(--text3); margin-bottom: 8px; }
  .avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--blau-hell); color: var(--blau-text); font-weight: 700; font-size: 14px;
    display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; }
  .avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; }
  .avatar.gross { width: 84px; height: 84px; font-size: 32px; }
  #profilKnopf { width: 40px; height: 40px; padding: 0; border: 0.5px solid var(--rand); border-radius: 50%; background: var(--karte); overflow: hidden; }
  #profilKnopf .avatar { width: 100%; height: 100%; }
  .schalter { position: relative; width: 51px; height: 31px; flex: 0 0 auto; border-radius: 16px; border: none; padding: 0; margin: 0; background: var(--rand); transition: background .2s; }
  .schalter::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 2px 4px rgba(0,0,0,.2); transition: transform .2s; }
  .schalter.an { background: var(--gruen); }
  .schalter.an::after { transform: translateX(20px); }
  .einstellung { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 0.5px solid var(--rand); }
  .einstellung:last-child { border-bottom: none; }
  .einstellung .inhalt { flex: 1; }
  .einstellung .haupt { font-size: 15px; }
  .einstellung .neben { font-size: 13px; color: var(--text2); margin-top: 2px; }
  .galerie { position: relative; }
  .galerie-spur { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
  .galerie-spur::-webkit-scrollbar { display: none; }
  .galerie-spur img { flex: 0 0 100%; width: 100%; aspect-ratio: 4/5; object-fit: cover; scroll-snap-align: center; display: block; }
  .galerie-punkte { position: absolute; left: 0; right: 0; bottom: 10px; display: flex; justify-content: center; gap: 5px; pointer-events: none; }
  .galerie-punkte span { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,.55); }
  .galerie-punkte span.an { background: #fff; }
  .galerie-zahl { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,.55); color: #fff; font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 10px; }
  .auswahl-liste .zeile { cursor: pointer; }
  .sterne { color: var(--gold); letter-spacing: 1px; white-space: nowrap; }
  .abzeichen { display: inline-block; font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 8px; background: var(--feld); color: var(--text2); }
  .raster { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
  .raster img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 10px; display: block; background: var(--feld); }
  details > summary { list-style: none; cursor: pointer; color: var(--text2); font-size: 14px; }
  details > summary::-webkit-details-marker { display: none; }

  /* Segmente & Chips */
  .segment { display: flex; background: var(--feld); border-radius: 12px; padding: 3px; gap: 2px; margin-bottom: 14px; }
  .segment button { flex: 1; border: none; background: none; color: var(--text2); padding: 8px 4px; border-radius: 10px; font-size: 14px; font-weight: 600; margin: 0; }
  .suche { position: relative; margin-bottom: 14px; }
  .suche > i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text3); font-size: 18px; pointer-events: none; }
  .suche input { margin: 0; padding-left: 38px; padding-right: 40px; -webkit-appearance: none; appearance: none; }
  .suche input::-webkit-search-cancel-button { display: none; }
  .suche-x { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); border: none; background: none; color: var(--text3); width: 32px; height: 32px; margin: 0; padding: 0; font-size: 16px; }
  .suche input:placeholder-shown + .suche-x { display: none; }
  .ort-arten { display: grid; grid-template-columns: 1.35fr 1fr 1fr 1fr 1fr; gap: 5px; margin-bottom: 14px; }
  .ort-arten button { display: flex; flex-direction: column; align-items: center; gap: 2px; border: 1px solid var(--rand); background: var(--karte); color: var(--text2);
    border-radius: 12px; padding: 8px 2px 6px; margin: 0; font-size: 12px; font-weight: 600; min-width: 0; }
  .ort-arten button i { font-size: 22px; }
  .ort-arten button span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; letter-spacing: -0.2px; }
  .ort-arten button small { font-size: 11px; font-weight: 500; color: var(--text3); }
  .ort-arten button.aktiv { background: var(--blau); border-color: var(--blau); color: #fff; }
  .ort-arten button.aktiv small { color: rgba(255,255,255,.75); }
  .segment button.aktiv { background: var(--karte); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-bottom: 12px; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: 0 0 auto; border: 1px solid var(--rand); background: var(--karte); color: var(--text); padding: 7px 14px; border-radius: 18px; font-size: 14px; font-weight: 500; margin: 0; }
  .chip.aktiv { background: var(--blau); border-color: var(--blau); color: #fff; }

  /* Navigation */
  #unterLeiste { position: sticky; top: 6px; z-index: 30; margin: 0 0 14px; }
  #unterLeiste.segment { background: var(--feld); }
  #untenLeiste { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; display: flex; justify-content: center;
    background: color-mix(in srgb, var(--karte) 92%, transparent); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
    border-top: 0.5px solid var(--rand); padding: 4px 0 calc(4px + env(safe-area-inset-bottom)); }
  #untenLeiste button { flex: 1; max-width: 130px; background: none; border: none; margin: 0; padding: 12px 0 10px; color: var(--text3);
    font-size: 15px; font-weight: 600; position: relative; }
  #untenLeiste button.aktiv { color: var(--blau-text); }
  #untenLeiste button.aktiv::after { content: ""; position: absolute; left: 32%; right: 32%; bottom: 2px; height: 3px; border-radius: 2px; background: var(--blau-text); }
  .punkt { position: absolute; top: 6px; right: 8px; width: 8px; height: 8px; border-radius: 50%; background: var(--rot); }
  #untenLeiste .punkt { top: 8px; right: calc(50% - 34px); }
  .segment button { position: relative; }

  /* Home */
  .countdown-zahl { font-size: 30px; font-weight: 800; letter-spacing: -0.02em; }
  .countdown-rest { font-size: 15px; color: var(--text2); margin-top: 2px; }
  #plusKnopf { position: fixed; right: 20px; bottom: calc(86px + env(safe-area-inset-bottom)); z-index: 45; width: 58px; height: 58px; margin: 0; padding: 0;
    border: none; border-radius: 50%; background: var(--blau); color: #fff; font-size: 27px; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 18px rgba(31,58,104,.35); }
  body:not(.auf-home) #plusKnopf, body.ausgeloggt #plusKnopf { display: none; }
  .eingabe-pille { display: flex; align-items: center; gap: 2px; background: var(--feld); border-radius: 22px; padding: 0 4px 0 14px; }
  .eingabe-pille input { background: none !important; border: none !important; margin: 0; padding: 11px 0; flex: 1; }

  /* Feed */
  .feed-post { padding: 0; overflow: hidden; }
  .feed-post > img, .feed-post > video { width: 100%; display: block; }
  .feed-post > img.laedt, .raster img.laedt { min-height: 280px; animation: puls 1.2s ease-in-out infinite; }
  .raster img.laedt { min-height: 0; }
  @keyframes puls { 50% { opacity: .5; } }
  .kopf { display: flex; align-items: center; gap: 10px; padding: 12px 14px; }
  .kopf .name { font-weight: 600; font-size: 15px; }
  .kopf .zeit { margin-left: auto; font-size: 13px; color: var(--text2); text-align: right; }
  .spaet { color: var(--rot); font-weight: 600; }
  .aktionen { display: flex; align-items: center; gap: 0; padding: 4px 6px 0; }
  .aktionen .icon-knopf { color: var(--text); font-size: 24px; }
  .aktionen .icon-knopf.rot { color: var(--rot); }
  .reaktionen { margin-left: auto; display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; padding-right: 6px; }
  .reaktion { border: 1px solid transparent; background: var(--feld); color: var(--text); padding: 3px 9px; border-radius: 14px; font-size: 13px; margin: 0; }
  .reaktion.meins { background: var(--blau-hell); border-color: color-mix(in srgb, var(--blau-text) 30%, transparent); }
  .emoji-wahl { display: flex; gap: 6px; padding: 6px 14px 0; flex-wrap: wrap; }
  .emoji-wahl button { border: none; background: var(--feld); padding: 6px 10px; font-size: 20px; border-radius: 20px; margin: 0; color: var(--text); }
  .kommentare { padding: 6px 14px 0; }
  .kommentar { font-size: 14px; margin: 4px 0; line-height: 1.4; overflow-wrap: anywhere; }
  .kommentar img { width: 55%; border-radius: 12px; margin-top: 4px; display: block; }
  .feed-post .eingabe-pille { margin: 10px 12px 12px; }
  .mehr-laden { margin: 4px 0 20px; }

  /* Overlays: Blatt, Vollbild, Hinweise */
  .blatt-hg { position: fixed; inset: 0; z-index: 90; background: rgba(0,0,0,.4); display: flex; align-items: flex-end; justify-content: center;
    animation: einblenden .2s ease; }
  .blatt { background: var(--karte); width: 100%; max-width: 560px; border-radius: 22px 22px 0 0; padding: 10px 18px calc(18px + env(safe-area-inset-bottom));
    max-height: 88vh; overflow-y: auto; animation: hochgleiten .25s cubic-bezier(.2,.8,.2,1); }
  .blatt::before { content: ""; display: block; width: 38px; height: 5px; border-radius: 3px; background: var(--rand); margin: 0 auto 14px; }
  .blatt h3 { font-size: 19px; margin: 0 0 4px; }
  .blatt .meta { margin-bottom: 14px; }
  .blatt.mittig { border-radius: 22px; margin: 16px; }
  .blatt-hg.mitte { align-items: center; }
  .blatt.hoch { height: 80vh; display: flex; flex-direction: column; }
  @keyframes hochgleiten { from { transform: translateY(40px); opacity: .4; } }
  @keyframes einblenden { from { opacity: 0; } }
  .stern-wahl { display: flex; justify-content: center; gap: 6px; margin: 8px 0 14px; }
  .stern-wahl button { border: none; background: none; font-size: 36px; padding: 2px; margin: 0; color: var(--rand); }
  .stern-wahl button.an { color: var(--gold); }
  #vollbild { position: fixed; inset: 0; z-index: 120; background: rgba(0,0,0,.95); display: none; align-items: center; justify-content: center; }
  #vollbild img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .herz-pop { position: absolute; left: 50%; top: 45%; font-size: 90px; color: #fff; transform: translate(-50%,-50%) scale(.3); opacity: 0; pointer-events: none;
    animation: herzPop .8s ease forwards; text-shadow: 0 4px 20px rgba(0,0,0,.25); }
  @keyframes herzPop { 30% { transform: translate(-50%,-50%) scale(1.15); opacity: 1; } 70% { transform: translate(-50%,-50%) scale(1); opacity: 1; } 100% { transform: translate(-50%,-60%) scale(1); opacity: 0; } }
  #toastBox { position: fixed; left: 0; right: 0; bottom: calc(96px + env(safe-area-inset-bottom)); z-index: 200; display: flex; flex-direction: column;
    align-items: center; gap: 8px; pointer-events: none; padding: 0 20px; }
  .toast { background: #111827; color: #fff; padding: 11px 16px; border-radius: 14px; font-size: 14px; font-weight: 500; max-width: 420px; text-align: center;
    box-shadow: 0 8px 24px rgba(0,0,0,.18); transition: opacity .3s, transform .3s; }
  @media (prefers-color-scheme: dark) { .toast { background: #f3f4f6; color: #111827; } }
  .toast.fehler { background: var(--rot); color: #fff; }
  .toast.weg { opacity: 0; transform: translateY(8px); }
  body:has(.blatt-hg) #toastBox { bottom: auto; top: max(14px, env(safe-area-inset-top)); }
  #ziehen { position: fixed; top: 0; left: 0; right: 0; z-index: 60; text-align: center; padding: max(10px, env(safe-area-inset-top)) 0 10px;
    font-size: 13px; color: var(--text2); transform: translateY(-100%); transition: transform .15s; }
  #offlineBand { position: sticky; top: 0; z-index: 35; text-align: center; font-size: 13px; font-weight: 600; padding: 6px; background: var(--feld); color: var(--text2); border-radius: 10px; margin-bottom: 10px; }
  #tastaturFeld { min-height: 46px; border: 2px dashed var(--rand); border-radius: 12px; padding: 10px; margin-bottom: 10px; }
  #tastaturFeld:empty::before { content: "Hier tippen und Sticker aus der Tastatur wählen"; color: var(--text3); font-size: 14px; }
</style>
</head>
<body class="ausgeloggt">
<header>
  <span id="titel">Servus</span>
  <button id="profilKnopf" class="versteckt" onclick="einstellungen()" aria-label="Einstellungen"></button>
</header>

<main>
  <!-- Login -->
  <div id="login" class="karte versteckt">
    <div class="karte-titel">Anmelden</div>
    <input id="email" type="email" placeholder="E-Mail" autocomplete="username">
    <input id="passwort" type="password" placeholder="Passwort" autocomplete="current-password">
    <button class="knopf" onclick="einloggen()">Einloggen</button>
  </div>

  <!-- App -->
  <div id="app" class="versteckt">
    <div id="offlineBand" class="versteckt"><i class="ti ti-wifi-off"></i> Offline – du siehst den letzten Stand</div>
    <div id="unterLeiste" class="segment versteckt"></div>

    <section class="seite" id="seite-heute">

          <button class="icon-knopf blau" onclick="notizSenden()" aria-label="Senden"><i class="ti ti-send"></i></button>
        </div>
      </div>
      <div id="feed"></div>
    </section>
  </div>
</main>

<button id="plusKnopf" onclick="postenAuswahl()" aria-label="Foto oder Video posten"><i class="ti ti-camera"></i></button>
<nav id="untenLeiste" class="versteckt"></nav>
<div id="vollbild" onclick="this.style.display='none'"><img alt=""></div>
<div id="ziehen"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* =========================================================
   Einstellungen
   ========================================================= */
const SUPABASE_URL = "https://uqsakgfdlcnvqqkhdryt.supabase.co";
const SUPABASE_KEY = "sb_publishable_pFCNvR9izezcO8GZOD6tTA_ET-YppfI";
const GIPHY_KEY = "kEmWwXsKqsGfZMIqsEQY7vP3YVqCcXLQ";
const VAPID_PUBLIC = "BN9ZIOLWc1yuuTJW3ZZE1F3Mxl8ZuYyQhfcdg8rliLdmtgNNVLopFWgZzEaK9d7UBRmrnAWd3TK1DwoGHVF2WCo";
const EMOJIS = ["❤️", "😂", "😭", "😮", "🔥"];
const MAX_VIDEO_SEKUNDEN = 15;
const REISEN = ["Lauli fährt nach München", "Dani fährt nach Düsseldorf"];

const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let ich = null;
let leute = [];

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});

/* =========================================================
   Hilfen
   ========================================================= */
const $ = id => document.getElementById(id);

function schuetzen(t) {
  return String(t ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

const speicher = {
  lesen(name, standard = null) { try { const w = localStorage.getItem(name); return w === null ? standard : JSON.parse(w); } catch (e) { return standard; } },
  schreiben(name, wert) { try { localStorage.setItem(name, JSON.stringify(wert)); } catch (e) {} }
};

function nameVon(id) { return (leute.find(p => p.user_id === id) || {}).name || "?"; }
function andererId() { return (leute.find(p => p.user_id !== ich.id) || {}).user_id; }
function avatar(id, klasse = "") {
  const p = leute.find(x => x.user_id === id);
  const url = p?.bild_pfad ? bildUrl(p.bild_pfad) : "";
  return url ? `<span class="avatar ${klasse}"><img src="${url}" alt=""></span>`
    : `<span class="avatar ${klasse}">${schuetzen(nameVon(id).charAt(0).toUpperCase())}</span>`;
}
function sterneText(n) { return "★".repeat(n) + "☆".repeat(5 - n); }
function leer(text, icon = "mood-empty") { return `<div class="leer"><i class="ti ti-${icon}"></i>${text}</div>`; }
function datumKurz(d) { return new Date(d).toLocaleDateString("de-DE", { day: "numeric", month: "short" }); }

function wieLange(datum) {
  const s = (Date.now() - new Date(datum)) / 1000;
  if (s < 60) return "gerade eben";
  if (s < 3600) return `vor ${Math.floor(s / 60)} Min.`;
  if (s < 86400) return `vor ${Math.floor(s / 3600)} Std.`;
  if (s < 172800) return "gestern";
  if (s < 604800) return `vor ${Math.floor(s / 86400)} Tagen`;
  return datumKurz(datum);
}

/* ---------- Hinweise ---------- */
function toast(text, art = "info") {
  let box = $("toastBox");
  if (!box) { box = document.createElement("div"); box.id = "toastBox"; document.body.appendChild(box); }
  const t = document.createElement("div");
  t.className = "toast " + art;
  t.textContent = text;
  box.appendChild(t);
  const dauer = Math.min(6000, 1800 + String(text).length * 45);
  setTimeout(() => t.classList.add("weg"), dauer);
  setTimeout(() => t.remove(), dauer + 400);
}

function istOffline(e) { return !navigator.onLine || /fetch|network|load failed|netzwerk/i.test(String(e?.message || e)); }
function fehler(e) {
  toast(istOffline(e) ? "Keine Internetverbindung – bitte später nochmal." : "Hat nicht geklappt: " + (e?.message || e), "fehler");
}
// Führt eine Datenbank-Aktion aus und zeigt bei Problemen einen Hinweis. Gibt false zurück, wenn es nicht geklappt hat.
async function tun(anfrage) {
  try {
    const { data, error } = await anfrage;
    if (error) { fehler(error); return false; }
    return data ?? true;
  } catch (e) { fehler(e); return false; }
}

window.addEventListener("error", e => { if (e.message && !/Script error/i.test(e.message)) toast("Fehler: " + e.message, "fehler"); });
window.addEventListener("unhandledrejection", e => fehler(e.reason));

/* ---------- Eigene Fenster (statt Pop-ups des iPhones) ---------- */
function blatt(html, { mitte = false, klasse = "" } = {}) {
  const hg = document.createElement("div");
  hg.className = "blatt-hg" + (mitte ? " mitte" : "");
  hg.innerHTML = `<div class="blatt ${mitte ? "mittig" : ""} ${klasse}">${html}</div>`;
  document.body.appendChild(hg);
  const zu = () => { hg.remove(); hg.dispatchEvent(new Event("zu")); };
  hg.addEventListener("click", e => { if (e.target === hg) zu(); });
  return { el: hg.querySelector(".blatt"), hg, zu };
}

function eingabe(titel, { wert = "", platzhalter = "", hinweis = "", typ = "text", ok = "Fertig" } = {}) {

function sterneWahl(titel, { untertitel = "", platzhalter = "Kurzer Kommentar (optional)", ueberspringen = "Abbrechen" } = {}) {
  return new Promise(fertig => {
    let sterne = 0;

      <h3>${schuetzen(titel)}</h3>

    const ende = wert => { if (erledigt) return; erledigt = true; b.zu(); fertig(wert); };
    b.el.addEventListener("click", e => {
      const s = e.target.closest("[data-s]");
      if (s) {

/* ---------- Bilder ---------- */
function bildVerkleinern(datei, maxSeite = 1600, typ = "image/jpeg", qualitaet = 0.85) {
  return new Promise((ok, nein) => {
    const bild = new Image();
    bild.onload = () => {
      const f = Math.min(1, maxSeite / Math.max(bild.width, bild.height));
      const c = document.createElement("canvas");
      c.width = Math.round(bild.width * f);
      c.height = Math.round(bild.height * f);
      c.getContext("2d").drawImage(bild, 0, 0, c.width, c.height);
      URL.revokeObjectURL(bild.src);
      c.toBlob(b => b ? ok(b) : nein(new Error("Bild konnte nicht umgewandelt werden")), typ, qualitaet);
    };
    bild.onerror = () => nein(new Error("Bild konnte nicht geladen werden"));
    bild.src = URL.createObjectURL(datei);
  });
}

async function bildHochladen(datei, vorsilbe = "") {
  const blob = await bildVerkleinern(datei, 1600);
  const pfad = `${ich.id}/${vorsilbe}${Date.now()}-${Math.random().toString(36).slice(2, 6)}.jpg`;
  const { error } = await db.storage.from("medien").upload(pfad, blob, { contentType: "image/jpeg", cacheControl: "31536000" });
  if (error) throw error;
  return pfad;
}

// Feste Bild-Adressen merken: dann kommen bekannte Bilder aus dem Handy-Speicher statt aus dem Internet
function bildSpeicher() {
  if (!window._bilder) {
    const jetzt = Date.now();
    window._bilder = {};
    for (const [p, e] of Object.entries(speicher.lesen("bildLinks", {}))) if (e && e.bis > jetzt) window._bilder[p] = e;
  }
  return window._bilder;
}
function bildUrl(pfad) { return bildSpeicher()[pfad]?.url || ""; }
async function bildUrlsHolen(pfade) {
  const links = bildSpeicher();
  const fehlend = [...new Set(pfade.filter(p => p && !links[p]))];
  if (!fehlend.length) return links;
  try {
    const { data } = await db.storage.from("medien").createSignedUrls(fehlend, 7 * 86400);
    const bis = Date.now() + 6 * 86400 * 1000;
    (data || []).forEach(l => { if (l.signedUrl) links[l.path] = { url: l.signedUrl, bis }; });
    speicher.schreiben("bildLinks", links);
  } catch (e) {}
  return links;
}
function bildTag(pfad, extra = "") {
  return `<img src="${bildUrl(pfad)}" class="laedt" decoding="async" loading="lazy" onload="this.classList.remove('laedt')" ${extra}>`;
}

/* ---------- Sofort anzeigen aus dem Speicher, dann aktualisieren ---------- */
async function zeigeMitCache(schluessel, laden, zeichnen) {
  const alt = speicher.lesen("cache:" + schluessel);
  if (alt !== null) zeichnen(alt, true);
  try {
    const neu = await laden();
    speicher.schreiben("cache:" + schluessel, neu);
    $("offlineBand").classList.add("versteckt");
    zeichnen(neu, false);
  } catch (e) {
    if (istOffline(e)) { $("offlineBand").classList.remove("versteckt"); if (alt === null) zeichnen(null, false); }
    else fehler(e);
  }
}
// Hilfsfunktion für Abfragen in "laden"-Funktionen: wirft bei Fehler
async function hol(anfrage) {
  const { data, error } = await anfrage;
  if (error) throw error;
  return data;
}

const BEREICHE = [
  { id: "home", name: "Home", titel: "Servus", seiten: [["heute", "Home"]] },
  { id: "dates", name: "Dates", seiten: [["liste", "Liste"], ["abc", "ABC"], ["wuensche", "Wünsche"]] },
  { id: "activity", name: "Activity", seiten: [["watchlist", "Watchlist"], ["orte", "Orte"], ["kochbuch", "Kochbuch"]] },
  { id: "recap", name: "Recap", seiten: [["essen", "Essen"], ["gefuehl", "Gefühl"], ["rueckblick", "Rückblick"]] }
];
const SEITEN = {};
function registriereSeite(id, def) { SEITEN[id] = def; }

let aktuelleSeite = "heute";
const navMerk = {
  lesen: (n, s) => { try { return JSON.parse(sessionStorage.getItem(n)) ?? s; } catch (e) { return s; } },
  schreiben: (n, w) => { try { sessionStorage.setItem(n, JSON.stringify(w)); } catch (e) {} }
};
const letzteSeite = navMerk.lesen("navLetzte", {});
const bereichVon = seite => BEREICHE.find(b => b.seiten.some(([id]) => id === seite));

function navigationBauen() {
  $("untenLeiste").innerHTML = BEREICHE.map(b => `<button data-bereich="${b.id}">${b.name}</button>`).join("");
  $("untenLeiste").onclick = e => {
    const k = e.target.closest("[data-bereich]");
    if (!k) return;
    const b = BEREICHE.find(x => x.id === k.dataset.bereich);
    seiteOeffnen(letzteSeite[b.id] || b.seiten[0][0]);
  };
  $("unterLeiste").onclick = e => { const k = e.target.closest("[data-seite]"); if (k) seiteOeffnen(k.dataset.seite); };
  const start = navMerk.lesen("navAktuell", "heute");
  seiteOeffnen(bereichVon(start) ? start : "heute", { scrollen: false });
}

function seiteOeffnen(id, { scrollen = true } = {}) {
  const bereich = bereichVon(id);
  if (!bereich) return;
  aktuelleSeite = id;
  letzteSeite[bereich.id] = id;
  navMerk.schreiben("navLetzte", letzteSeite);
  navMerk.schreiben("navAktuell", id);

  $("titel").textContent = bereich.titel || bereich.name;
  document.body.classList.toggle("auf-home", id === "heute");
  document.querySelectorAll("#untenLeiste [data-bereich]").forEach(k => k.classList.toggle("aktiv", k.dataset.bereich === bereich.id));
  const unter = $("unterLeiste");
  unter.classList.toggle("versteckt", bereich.seiten.length < 2);
  unter.innerHTML = bereich.seiten.map(([sid, name]) => `<button data-seite="${sid}" class="${sid === id ? "aktiv" : ""}">${name}</button>`).join("");

  let el = $("seite-" + id);
  if (!el) {
    el = document.createElement("section");
    el.className = "seite";
    el.id = "seite-" + id;
    $("app").appendChild(el);
  }
  document.querySelectorAll(".seite").forEach(s => s.classList.toggle("versteckt", s !== el));
  if (scrollen) window.scrollTo(0, 0);

  gesehenMerken(id);
  seiteAktualisieren();
  punkteZeigen();
}

function seiteAktualisieren() {
  if (aktuelleSeite === "heute") return homeLaden();
  const def = SEITEN[aktuelleSeite];
  const el = $("seite-" + aktuelleSeite);
  if (def && el) def.render(el);
  else if (el && !def && !el.innerHTML) el.innerHTML = leer("Lädt …", "loader");
}

const QUELLEN = {

  gefuehl: [["checkins", "user_id"]]
};
const neuIn = new Set();

function gesehenMerken(id) {
  const g = speicher.lesen("gesehen", {});
  g[id] = new Date().toISOString();
  speicher.schreiben("gesehen", g);
  neuIn.delete(id);
}

async function punkteAktualisieren() {
  if (!ich || !navigator.onLine) return;
  const g = speicher.lesen("gesehen", {});
  const standard = new Date(Date.now() - 86400000).toISOString();
  await Promise.all(Object.entries(QUELLEN).map(async ([seite, tabellen]) => {
    if (seite === aktuelleSeite) return;
    for (const [tabelle, spalte] of tabellen) {
      try {
        const { count } = await db.from(tabelle).select("id", { count: "exact", head: true }).neq(spalte, ich.id).gt("erstellt_um", g[seite] || standard);
        if (count) { neuIn.add(seite); return; }
      } catch (e) {}
    }
    neuIn.delete(seite);
  }));
  punkteZeigen();
}

function punkteZeigen() {
  const setzen = (k, an) => {
    const p = k.querySelector(".punkt");
    if (an && !p) k.insertAdjacentHTML("beforeend", '<span class="punkt"></span>');
    if (!an && p) p.remove();
  };
  document.querySelectorAll("#unterLeiste [data-seite]").forEach(k => setzen(k, neuIn.has(k.dataset.seite)));
  document.querySelectorAll("#untenLeiste [data-bereich]").forEach(k => {
    const b = BEREICHE.find(x => x.id === k.dataset.bereich);
    setzen(k, b.seiten.some(([id]) => neuIn.has(id) && id !== aktuelleSeite));
  });
}

/* ---------- Countdown & Treffen ---------- */
function restZeit(datum) {
  const diff = new Date(datum) - new Date();
  if (diff <= 0) return null;
  return { t: Math.floor(diff / 864e5), h: Math.floor(diff / 36e5) % 24, m: Math.floor(diff / 6e4) % 60 };
}

let besuchDaten = null;
function ladeBesuch() {
  zeigeMitCache("besuche", async () => {
    const [kommend, letzte] = await Promise.all([
      hol(db.from("besuche").select("*").gte("ankunft", new Date(Date.now() - 60 * 864e5).toISOString()).order("ankunft")),
      hol(db.from("besuche").select("reisender, ankunft").lte("ankunft", new Date().toISOString()).order("ankunft", { ascending: false }).limit(1))
    ]);
    return { kommend, letzte: letzte[0] || null };
  }, daten => { besuchDaten = daten; zeigeCountdown(); });
}

function zeigeCountdown() {
  const box = $("countdownKarte");
  if (!besuchDaten) { box.innerHTML = leer("Lädt …", "loader"); return; }
  const jetzt = new Date();
  const besuche = (besuchDaten.kommend || []).filter(b =>
    new Date(b.ankunft) > jetzt || (b.abreise && new Date(b.abreise + "T23:59") >= jetzt));
  const naechster = besuche[0];
  const r = naechster && restZeit(naechster.ankunft);
  const letzte = besuchDaten.letzte;
  const zuletzt = letzte ? letzte.reisender.split(" ")[0] : null;
  const dran = zuletzt ? (REISEN.find(x => !x.startsWith(zuletzt)) || "").split(" ")[0] : null;

  let kopf;
  if (!naechster) kopf = `<div class="countdown-zahl">Noch kein Treffen</div><div class="countdown-rest">Tragt euer nächstes Wiedersehen ein</div>`;
  else if (!r) kopf = `<div class="countdown-zahl">Ihr seid zusammen</div><div class="countdown-rest">bis ${naechster.abreise ? datumKurz(naechster.abreise) : "bald"}</div>`;
  else kopf = `<div class="countdown-zahl">Noch ${r.t} ${r.t === 1 ? "Tag" : "Tage"}</div><div class="countdown-rest">${r.h} Std · ${r.m} Min bis zum Wiedersehen</div>`;

  box.innerHTML = `
    ${kopf}
    ${besuche.length ? `<div style="margin-top:12px">${besuche.map(b => `
      <div class="zeile">
        <i class="ti ti-train" style="font-size:20px;color:var(--text2)"></i>
        <div class="inhalt">
          <div class="haupt">${schuetzen(b.reisender)}</div>
          <div class="neben">${new Date(b.ankunft).toLocaleString("de-DE", { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })}${b.abreise ? " – " + datumKurz(b.abreise) : ""}</div>
        </div>
        <button class="icon-knopf" onclick="besuchLoeschen(${b.id})" aria-label="Löschen"><i class="ti ti-trash"></i></button>
      </div>`).join("")}</div>` : ""}
    ${zuletzt ? `<div class="meta" style="margin-top:10px">Zuletzt gefahren: <b>${schuetzen(zuletzt)}</b> (${datumKurz(letzte.ankunft)}) · Als Nächstes dran: <b>${schuetzen(dran)}</b></div>` : ""}
    <button class="knopf zweit" style="margin-top:12px" onclick="besuchFormular()"><i class="ti ti-plus"></i> Treffen eintragen</button>`;
}
setInterval(() => { if (aktuelleSeite === "heute" && besuchDaten) zeigeCountdown(); }, 60000);

function besuchFormular() {
  const zuletzt = besuchDaten?.letzte?.reisender?.split(" ")[0];
  const vorschlag = REISEN.find(x => zuletzt && !x.startsWith(zuletzt)) || REISEN[0];
  const b = blatt(`
    <h3>Treffen eintragen</h3>
    <div class="meta">Wer fährt, und wann kommt ihr an?</div>
    <select id="bfReise">${REISEN.map(x => `<option ${x === vorschlag ? "selected" : ""}>${x}</option>`).join("")}</select>
    <div class="meta">Ankunft</div>
    <input id="bfAnkunft" type="datetime-local">
    <div class="meta">Abreise (optional)</div>
    <input id="bfAbreise" type="date">
    <div class="reihe"><button class="knopf zweit" data-a="0">Abbrechen</button><button class="knopf" data-a="1">Speichern</button></div>`);
  b.el.addEventListener("click", async e => {
    const k = e.target.closest("[data-a]");
    if (!k) return;
    if (k.dataset.a === "0") return b.zu();
    const ankunft = $("bfAnkunft").value;
    if (!ankunft) return toast("Bitte die Ankunft eintragen", "fehler");
    const ok = await tun(db.from("besuche").insert({ reisender: $("bfReise").value, ankunft: new Date(ankunft).toISOString(), abreise: $("bfAbreise").value || null }));
    if (ok) { b.zu(); toast("Treffen gespeichert ✓"); ladeBesuch(); }
  });
}

async function besuchLoeschen(id) {
  if (!await frage("Dieses Treffen löschen?", { ja: "Löschen", gefahr: true })) return;
  if (await tun(db.from("besuche").delete().eq("id", id))) ladeBesuch();
}

        ${fuerMich ? "" : `<button class="icon-knopf" onclick="notizErledigt(${n.id})" aria-label="Löschen"><i class="ti ti-trash"></i></button>`}
      </div>`;
    }).join("") || '<div class="meta">Keine offenen Erinnerungen</div>';
    const fuerMich = offen.filter(n => n.an === ich.id).length;
    if (navigator.setAppBadge) fuerMich ? navigator.setAppBadge(fuerMich).catch(() => {}) : navigator.clearAppBadge().catch(() => {});
  });
}

/* ---------- Fotos & Videos posten ---------- */
function videoDauer(datei) {
  return new Promise(ok => {
    const v = document.createElement("video");
    v.preload = "metadata";
    v.onloadedmetadata = () => { URL.revokeObjectURL(v.src); ok(v.duration || 0); };
    v.onerror = () => ok(0);
    v.src = URL.createObjectURL(datei);
  });
}

function postenAuswahl() {
  const b = blatt(`
    <h3>Was möchtest du posten?</h3>
    <div class="meta">Aus der Galerie kannst du bis zu 10 Fotos auf einmal posten.</div>
    <div class="auswahl-liste">
      <div class="zeile" data-a="kamera"><i class="ti ti-camera" style="font-size:24px;color:var(--blau-text)"></i><div class="inhalt"><div class="haupt">Kamera</div><div class="neben">Foto oder kurzes Video aufnehmen</div></div><i class="ti ti-chevron-right" style="color:var(--text3)"></i></div>
      <div class="zeile" data-a="galerie"><i class="ti ti-photo" style="font-size:24px;color:var(--blau-text)"></i><div class="inhalt"><div class="haupt">Aus der Galerie</div><div class="neben">Ein Video oder mehrere Fotos</div></div><i class="ti ti-chevron-right" style="color:var(--text3)"></i></div>
    </div>`);
  b.el.addEventListener("click", e => {
    const k = e.target.closest("[data-a]");
    if (!k) return;
    const f = document.createElement("input");
    f.type = "file";
    f.className = "versteckt";
    if (k.dataset.a === "kamera") { f.accept = "image/*,video/*"; f.setAttribute("capture", "environment"); }
    else { f.accept = "image/*,video/*"; f.multiple = true; }
    document.body.appendChild(f);
    f.onchange = () => { const dateien = [...f.files]; f.remove(); hochladen(dateien); };
    f.click();
    b.zu();
  });
}

async function hochladen(dateien) {
  dateien = (dateien || []).filter(Boolean);
  if (!dateien.length) return;
  const video = dateien.find(d => d.type.startsWith("video"));
  if (video && dateien.length > 1) return toast("Videos bitte einzeln posten.", "fehler");
  if (dateien.length > 10) return toast("Höchstens 10 Fotos auf einmal.", "fehler");
  try {
    if (video) {
      const dauer = await videoDauer(video);
      if (dauer > MAX_VIDEO_SEKUNDEN + 1) return toast(`Videos dürfen höchstens ${MAX_VIDEO_SEKUNDEN} Sekunden lang sein.`, "fehler");
      if (video.size > 50 * 1024 * 1024) return toast("Das Video ist zu groß (max. 50 MB).", "fehler");
    }
    toast(dateien.length > 1 ? `${dateien.length} Fotos werden hochgeladen …` : "Wird hochgeladen …");
    const { data: alarme } = await db.from("alarme").select("*").order("ausgeloest_um", { ascending: false }).limit(1);
    let alarmId = null, zuSpaet = false;
    if (alarme && alarme.length) {
      const zeit = new Date(alarme[0].ausgeloest_um);
      if (zeit.toDateString() === new Date().toDateString()) {
        alarmId = alarme[0].id;
        zuSpaet = Date.now() - zeit.getTime() > 2 * 60 * 1000;
      }
    }
    const pfade = [];
    if (video) {
      const pfad = `${ich.id}/${Date.now()}.${(video.name.split(".").pop() || "mov").toLowerCase()}`;
      const { error } = await db.storage.from("medien").upload(pfad, video, { cacheControl: "31536000" });
      if (error) throw error;
      pfade.push(pfad);
    } else {
      for (const d of dateien) pfade.push(await bildHochladen(d));
    }
    const { error } = await db.from("posts").insert({
      datei_pfad: pfade[0], weitere_pfade: pfade.slice(1), typ: video ? "video" : "foto", alarm_id: alarmId, zu_spaet: zuSpaet
    });
    if (error) throw error;
    toast("Gepostet ✓");
    window.scrollTo({ top: 0, behavior: "smooth" });
    ladeFeed();
  } catch (e) {
    fehler(e);
  }
}

/* ---------- Feed ---------- */
let feedAnzahl = 20, feedLaedt = false;
function ladeFeed() {
  const anzahl = feedAnzahl;
  feedLaedt = true;
  return zeigeMitCache("feed", async () => {
    const posts = await hol(db.from("posts").select("*, reaktionen(*), kommentare(*)").order("erstellt_um", { ascending: false }).limit(anzahl));
    await bildUrlsHolen(posts.flatMap(p => [p.datei_pfad, ...(p.weitere_pfade || [])]));
    return posts;
  }, (posts, ausSpeicher) => feedZeichnen(posts || [], !ausSpeicher && (posts || []).length >= anzahl))
    .finally(() => { feedLaedt = false; });
}
function mehrLaden() {
  if (feedLaedt) return;
  feedAnzahl += 20;
  ladeFeed();
}
const feedBeobachter = "IntersectionObserver" in window
  ? new IntersectionObserver(e => { if (e.some(x => x.isIntersecting)) mehrLaden(); }, { rootMargin: "400px" }) : null;

function galerieHtml(p) {
  const alle = [p.datei_pfad, ...(p.weitere_pfade || [])];
  if (alle.length === 1) return `<img src="${bildUrl(p.datei_pfad)}" class="laedt" decoding="async" onload="this.classList.remove('laedt')" alt="">`;
  return `<div class="galerie">
    <div class="galerie-spur" onscroll="galeriePunkte(this)">${alle.map(x => `<img src="${bildUrl(x)}" decoding="async" loading="lazy" alt="">`).join("")}</div>
    <div class="galerie-punkte">${alle.map((_, i) => `<span class="${i ? "" : "an"}"></span>`).join("")}</div>
    <div class="galerie-zahl">1/${alle.length}</div>
  </div>`;
}
function galeriePunkte(spur) {
  const i = Math.round(spur.scrollLeft / spur.clientWidth);
  const g = spur.parentElement;
  g.querySelectorAll(".galerie-punkte span").forEach((s, n) => s.classList.toggle("an", n === i));
  g.querySelector(".galerie-zahl").textContent = `${i + 1}/${spur.children.length}`;
}

function feedZeichnen(posts, gibtMehr = false) {
  const feed = document.createDocumentFragment();
  for (const p of posts) {
    const url = bildUrl(p.datei_pfad);
    const medium = p.typ === "video"
      ? `<video src="${url}" controls playsinline preload="metadata"></video>`
      : galerieHtml(p);
    const reaktionen = p.reaktionen || [];
    const herzVonMir = reaktionen.some(r => r.emoji === "❤️" && r.user_id === ich.id);
    const chips = [...new Set(reaktionen.map(r => r.emoji))].map(e => {
      const alle = reaktionen.filter(r => r.emoji === e);
      return `<button class="reaktion ${alle.some(r => r.user_id === ich.id) ? "meins" : ""}" onclick="reagieren(${p.id}, '${e}')">${e} ${alle.length}</button>`;
    }).join("");
    const kommentare = (p.kommentare || []).slice().sort((a, b) => new Date(a.erstellt_um) - new Date(b.erstellt_um))
      .map(k => `<div class="kommentar"><b>${schuetzen(nameVon(k.user_id))}</b> ${k.gif_url ? `<img src="${schuetzen(k.gif_url)}" alt="">` : schuetzen(k.text)}</div>`).join("");

    const div = document.createElement("div");
    div.className = "post feed-post";
    div.dataset.post = p.id;
    div.innerHTML = `
      <div class="kopf">${avatar(p.user_id)}<div class="name">${schuetzen(nameVon(p.user_id))}</div>
        <div class="zeit">${wieLange(p.erstellt_um)}${p.zu_spaet ? '<br><span class="spaet">zu spät</span>' : ""}</div></div>
      ${medium}
      <div class="aktionen">
        <button class="icon-knopf ${herzVonMir ? "rot" : ""}" onclick="reagieren(${p.id}, '❤️')" aria-label="Gefällt mir"><i class="ti ti-heart"></i></button>
        <button class="icon-knopf" onclick="$('k${p.id}').focus()" aria-label="Kommentieren"><i class="ti ti-message-circle"></i></button>
        <button class="icon-knopf" onclick="$('ew${p.id}').classList.toggle('versteckt')" aria-label="Reagieren"><i class="ti ti-mood-smile"></i></button>
        <div class="reaktionen">${chips}</div>
      </div>
      <div class="emoji-wahl versteckt" id="ew${p.id}">
        ${EMOJIS.map(e => `<button onclick="reagieren(${p.id}, '${e}')">${e}</button>`).join("")}
        <button onclick="eigenesEmoji(${p.id})" aria-label="Anderes Emoji"><i class="ti ti-plus" style="font-size:18px"></i></button>
      </div>
      ${kommentare ? `<div class="kommentare">${kommentare}</div>` : ""}
      <div class="eingabe-pille">
        <input id="k${p.id}" placeholder="Kommentieren …" enterkeyhint="send" onkeydown="if (event.key === 'Enter') kommentieren(${p.id})">
        <button class="icon-knopf" onclick="gifSuchen(${p.id})" aria-label="GIF oder Sticker"><i class="ti ti-gif"></i></button>
        <button class="icon-knopf blau" onclick="kommentieren(${p.id})" aria-label="Senden"><i class="ti ti-send"></i></button>
      </div>`;
    feed.appendChild(div);
  }
  if (!posts.length) feed.appendChild(Object.assign(document.createElement("div"), { innerHTML: leer("Noch keine Fotos – tipp auf die Kamera unten rechts.", "camera") }));
  let mehr = null;
  if (gibtMehr) {
    mehr = Object.assign(document.createElement("button"), { className: "knopf zweit mehr-laden", innerHTML: '<i class="ti ti-history"></i> Ältere Fotos laden', onclick: mehrLaden });
    feed.appendChild(mehr);
  }

  const offen = {};
  document.querySelectorAll('#feed input[id^="k"]').forEach(f => { if (f.value) offen[f.id] = f.value; });
  const fokus = document.activeElement?.id;
  const y = window.scrollY;
  $("feed").replaceChildren(feed);
  window.scrollTo(0, y);
  for (const [id, wert] of Object.entries(offen)) if ($(id)) $(id).value = wert;
  if (fokus && /^k\d+$/.test(fokus)) $(fokus)?.focus();
  if (mehr && feedBeobachter) { feedBeobachter.disconnect(); feedBeobachter.observe(mehr); }
}

  else if (error) return fehler(error);
  ladeFeed();
}

async function stickerSpeichern(datei) {
  const blob = await bildVerkleinern(datei, 400, "image/png");

  const { error } = await db.storage.from("sticker").upload(pfad, blob, { contentType: "image/png", cacheControl: "31536000" });
  if (error) throw error;
  const url = db.storage.from("sticker").getPublicUrl(pfad).data.publicUrl;
  const { error: f } = await db.from("sticker").insert({ url, pfad });
  if (f) throw f;
  return url;
}
async function stickerHochladen(datei) {

function stickerSenden(id) { const s = (window.eigeneSticker || []).find(x => x.id === id); if (s) kommentarMitBild(s.url); }
async function stickerLoeschen(id) {

  try { kommentarMitBild(await stickerSpeichern(datei)); } catch (e) { fehler(e); }

function tastaturFeldEinrichten() {
  const feld = $("tastaturFeld");
  if (!feld) return;
  const bildAus = dt => dt && [...(dt.files || [])].find(f => f.type.startsWith("image/"));
  feld.addEventListener("paste", e => { const d = bildAus(e.clipboardData); if (d) { e.preventDefault(); tastaturSticker(d); } });
  feld.addEventListener("beforeinput", e => { const d = bildAus(e.dataTransfer); if (d) { e.preventDefault(); tastaturSticker(d); } });
  feld.addEventListener("input", async () => {
    const bild = feld.querySelector("img");
    if (!bild) return;
    try {
      const blob = await (await fetch(bild.src)).blob();
      tastaturSticker(new File([blob], "sticker.png", { type: blob.type || "image/png" }));
    } catch (e) { feld.innerHTML = ""; toast("Dieser Sticker lässt sich hier leider nicht einfügen.", "fehler"); }
  });
}

/* =========================================================
   Push-Benachrichtigungen
   ========================================================= */
function base64ZuBytes(s) {
  const rest = "=".repeat((4 - s.length % 4) % 4);
  const roh = atob((s + rest).replace(/-/g, "+").replace(/_/g, "/"));
  return Uint8Array.from([...roh].map(c => c.charCodeAt(0)));
}

async function pushAktivieren() {
  if (!("serviceWorker" in navigator) || !("PushManager" in window)) return toast("Bitte öffne die App über das Symbol auf dem Home-Bildschirm.", "fehler");
  if (await Notification.requestPermission() !== "granted") return toast("Benachrichtigungen wurden nicht erlaubt.", "fehler");
  const reg = await navigator.serviceWorker.register("sw.js");
  await navigator.serviceWorker.ready;
  let abo = await reg.pushManager.getSubscription();
  if (!abo) abo = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: base64ZuBytes(VAPID_PUBLIC) });
  if (await tun(db.from("push_abos").upsert({ abo: abo.toJSON() }, { onConflict: "user_id,abo", ignoreDuplicates: true }))) toast("Benachrichtigungen an ✓");
}

let pushAktiv = false;
async function pushStatusZeigen() {
  pushAktiv = false;
  try {
    if ("serviceWorker" in navigator && "PushManager" in window && Notification.permission === "granted") {
      const reg = await navigator.serviceWorker.getRegistration();
      pushAktiv = !!(reg && await reg.pushManager.getSubscription());
    }
  } catch (e) {}
  return pushAktiv;
}

async function pushUmschalten() {
  if (pushAktiv) {
    if (!await frage("Benachrichtigungen auf diesem Handy ausschalten?", { ja: "Ausschalten", details: "Du bekommst dann gar keine Nachrichten mehr von der App." })) return;
    const reg = await navigator.serviceWorker.getRegistration();
    const abo = reg && await reg.pushManager.getSubscription();
    if (abo) {
      await db.from("push_abos").delete().eq("abo->>endpoint", abo.endpoint);
      await abo.unsubscribe();
    }
    toast("Benachrichtigungen aus");
  } else {
    await pushAktivieren();
  }
  return pushStatusZeigen();
}

  await pushStatusZeigen();
  const b = blatt(`<div id="einst"></div>`, { klasse: "hoch" });
  const zeichnen = () => {
    const stumm = meine().stumm || [];
    b.el.querySelector("#einst").innerHTML = `
      <div style="text-align:center;margin-bottom:16px">
        ${avatar(ich.id, "gross")}
        <div style="font-size:20px;font-weight:700;margin-top:8px">${schuetzen(nameVon(ich.id))}</div>
        <button class="knopf zweit klein" style="margin-top:8px" data-a="bild"><i class="ti ti-camera"></i> Profilbild ändern</button>
      </div>
      <div class="abschnitt">Benachrichtigungen</div>
      <div class="karte" style="padding:4px 16px">
        <div class="einstellung"><div class="inhalt"><div class="haupt"><b>Auf diesem Handy</b></div><div class="neben">${pushAktiv ? "Push-Nachrichten sind an" : "Push-Nachrichten sind aus"}</div></div>
          <button class="schalter ${pushAktiv ? "an" : ""}" data-a="push" aria-label="Push an oder aus"></button></div>
      </div>
      <div class="karte" style="padding:4px 16px;${pushAktiv ? "" : "opacity:.5"}">
        ${BENACHRICHTIGUNGEN.map(([id, titel, text]) => `
          <div class="einstellung"><div class="inhalt"><div class="haupt">${titel}</div><div class="neben">${text}</div></div>
            <button class="schalter ${stumm.includes(id) ? "" : "an"}" data-art="${id}" aria-label="${titel}"></button></div>`).join("")}
        <div class="meta" style="padding:8px 0 10px">Erinnerungen von ${schuetzen(nameVon(andererId()))}, fällige To-dos und die Abhol-Erinnerung kommen immer.</div>
      </div>
      <div class="abschnitt">App</div>
      <div class="karte" style="padding:4px 16px">
        <div class="einstellung" data-a="neu" style="cursor:pointer"><i class="ti ti-refresh" style="font-size:20px;color:var(--text2)"></i><div class="inhalt"><div class="haupt">App neu laden</div></div></div>
        <div class="einstellung" data-a="raus" style="cursor:pointer;color:var(--rot)"><i class="ti ti-logout" style="font-size:20px"></i><div class="inhalt"><div class="haupt">Abmelden</div></div></div>
      </div>
      <div class="meta" style="text-align:center;margin-top:8px">Servus 🥨 · Version 2</div>`;
  };
  zeichnen();
  b.el.addEventListener("click", async e => {
    const k = e.target.closest("[data-a], [data-art]");
    if (!k) return;
    if (k.dataset.art) {
      const stumm = new Set(meine().stumm || []);
      stumm.has(k.dataset.art) ? stumm.delete(k.dataset.art) : stumm.add(k.dataset.art);
      k.classList.toggle("an");
      const liste = [...stumm];
      if (await tun(db.from("personen").update({ stumm: liste }).eq("user_id", ich.id))) { meine().stumm = liste; speicher.schreiben("leute", leute); }
      else zeichnen();
      return;
    }
    const a = k.dataset.a;
    if (a === "push") { await pushUmschalten(); zeichnen(); }
    if (a === "neu") location.reload();
    if (a === "raus") {
      if (!await frage("Wirklich abmelden?", { ja: "Abmelden", gefahr: true })) return;
      await db.auth.signOut();
      localStorage.clear();
      location.reload();
    }
    if (a === "bild") {
      const f = document.createElement("input");
      f.type = "file"; f.accept = "image/*"; f.className = "versteckt";
      document.body.appendChild(f);
      f.onchange = async () => {
        const d = f.files[0]; f.remove();
        if (!d) return;
        try {
          toast("Wird hochgeladen …");
          const blob = await bildVerkleinern(d, 400);
          const pfad = `${ich.id}/profil-${Date.now()}.jpg`;
          const { error } = await db.storage.from("medien").upload(pfad, blob, { contentType: "image/jpeg", cacheControl: "31536000" });
          if (error) throw error;
          if (!await tun(db.from("personen").update({ bild_pfad: pfad }).eq("user_id", ich.id))) return;
          meine().bild_pfad = pfad;
          await bildUrlsHolen([pfad]);
          speicher.schreiben("leute", leute);
          profilKnopfZeigen();
          zeichnen();
          seiteAktualisieren();
          toast("Profilbild gespeichert ✓");
        } catch (err) { fehler(err); }
      };
      f.click();
    }
  });
}

/* =========================================================
   Nach unten ziehen zum Aktualisieren
   ========================================================= */
(() => {
  const hinweis = $("ziehen");
  let start = null, dy = 0;
  const weg = () => { hinweis.style.transform = "translateY(-100%)"; start = null; dy = 0; };
  document.addEventListener("touchstart", e => {
    start = (window.scrollY <= 0 && !e.target.closest(".blatt-hg, #vollbild, .chips, #unterLeiste")) ? { x: e.touches[0].clientX, y: e.touches[0].clientY } : null;
    dy = 0;
  }, { passive: true });
  document.addEventListener("touchmove", e => {
    if (!start) return;
    const dx = Math.abs(e.touches[0].clientX - start.x);
    dy = e.touches[0].clientY - start.y;
    if (dx > 30 && dx > dy) return weg();
    if (dy > 30 && window.scrollY <= 0) {
      hinweis.innerHTML = dy > 120 ? '<i class="ti ti-refresh"></i> Loslassen zum Aktualisieren' : '<i class="ti ti-arrow-down"></i> Zum Aktualisieren ziehen';
      hinweis.style.transform = "translateY(0)";
    }
  }, { passive: true });
  document.addEventListener("touchend", () => {
    if (start && dy > 120 && window.scrollY <= 0) { hinweis.innerHTML = '<i class="ti ti-loader-2"></i> Lädt …'; location.reload(); return; }
    weg();
  });
})();

/* =========================================================
   Los geht's
   ========================================================= */
start();
</script>
<script src="bereiche.js"></script>
</body>
</html>
